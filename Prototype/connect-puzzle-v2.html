/* ==================================================================
   6B. CHẾ ĐỘ VÔ TẬN
   ------------------------------------------------------------------
   Không lượt, không mục tiêu, không par. Bàn LUÔN ĐẦY: ăn bao nhiêu ô
   thì bấy nhiêu ô mới rớt xuống từ trên. Ván chỉ kết thúc khi bàn thật
   sự bế tắc — không còn hai ô nào ghép được với nhau.

   Vì bàn đầy lại sau mỗi nước nên KHÔNG có lời giải tham chiếu, và cũng
   không cần: ở đây không có gì để bảo đảm giải được. Đổi lại phải bảo
   đảm điều khác — sau mỗi lần rớt, bàn phải còn ít nhất một nước đi,
   nếu không người chơi thua vì xúc xắc chứ không phải vì chơi dở.

   Áp lực đến từ SỐ MÀU tăng dần theo điểm: càng nhiều màu, ô càng khó
   gặp bạn cùng màu, và bế tắc dần trở thành chuyện có thật.
   ================================================================== */
const ENDLESS = {
  cols:7, rows:8,
  wildChance:.035,          // thỉnh thoảng rớt xuống một ô đa sắc cho dễ thở
  shuffles:3,
  comboMin:4,               // chuỗi từ 4 ô trở lên mới nối được combo
  comboCap:8
};

/** Số màu theo điểm — đây là toàn bộ đường cong khó của chế độ này. */
function endlessColors(score){
  return score >= 2500 ? 6 : score >= 800 ? 5 : 4;
}

/** Một ô mới rơi xuống. Vô tận nên dùng ngẫu nhiên thật, không cần tất định. */
function endlessCell(){
  const C = endlessColors(G.score);
  let m = null;
  if (Math.random() < ENDLESS.wildChance){ m = newMark(); m.k = K_WILD; }
  return {c: Math.floor(Math.random()*C), k:0, m};
}

function buildEndless(){
  const geo = makeGeometry({cols:ENDLESS.cols, rows:ENDLESS.rows});
  return {
    cfg:{name:'Vô tận', colors:4, seed:1},
    geo, gravity:true, endless:true,
    columns:[], markCols:[], solution:[], paths:null,
    totalCells:geo.cells.length, visibleCells:geo.cells.length,
    goalMode:false, goalTotal:0,
    par:0, maxMoves:Infinity, star2:Infinity,
    undos:0, shuffles:ENDLESS.shuffles
  };
}

/**
 * Đổ đầy lại các cột và ghi luôn quãng rơi cho hoạt ảnh.
 * `from` cố tình đặt cao hơn mép bàn để ô mới bay từ ngoài màn hình vào,
 * dùng chung đúng đường hoạt ảnh với ô rơi bình thường.
 */
function refillEndless(falls){
  const {cols, rows} = G.level.geo;
  const fresh = [];
  for (let x=0;x<cols;x++){
    const st = G.stacks[x];
    let k = 0;
    while (st.length < rows){
      st.push(endlessCell());
      falls.push({x, from: rows + k, to: st.length - 1});
      fresh.push({x, idx: st.length - 1});
      k++;
    }
  }

  // Không được để người chơi thua vì bàn mới rớt xuống đã bế tắc sẵn.
  // Gieo lại riêng các ô vừa rơi cho tới khi có ít nhất một nước đi.
  for (let tries=0; tries<60; tries++){
    syncBoard();
    if (hasMove()) break;
    fresh.forEach(f => { G.stacks[f.x][f.idx] = endlessCell(); });
  }
  return fresh;
}

/** Gieo lại toàn bộ bàn vô tận (nút Xáo). Luôn ra bàn còn đi được. */
function reshuffleEndless(){
  const {cols, rows} = G.level.geo;
  for (let tries=0; tries<80; tries++){
    for (let x=0;x<cols;x++)
      for (let i=0;i<G.stacks[x].length;i++) G.stacks[x][i] = endlessCell();
    syncBoard();
    if (hasMove()) return true;
  }
  return false;
}

function startEndless(){
  G.idx = -1;
  G.level = buildEndless();
  resetLevel();
  show('scGame');
  setTimeout(()=> toast('∞ Vô tận: ô rớt xuống mãi, không giới hạn lượt. Chuỗi ' +
    ENDLESS.comboMin + '+ ô liên tiếp để nhân điểm. Hết nước đi là xong ván.'), 420);
}

/**
 * Câu giới thiệu cho cơ chế LẦN ĐẦU gặp.
 * Không có nó thì người chơi nhìn ô xám hay con số trên ô mà không biết nó
 * là gì, và sẽ học luật bằng cách thua — kiểu học đắt nhất.
 */
const INTRO = [
  {key:'stones',   msg:'▩ Đá không nối được. Nó chỉ vỡ khi bạn ăn một chuỗi NGAY CẠNH nó.'},
  {key:'stoneHp2', msg:'▩ Đá dày cần bị va 2 lần mới vỡ.'},
  {key:'wilds',    msg:'✦ Ô đa sắc ghép được với mọi màu — nhưng mỗi chuỗi chỉ được dùng 1 ô.'},
  {key:'bombs',    msg:'⧗ Ô có số là ngòi nổ: hết số mà chưa ăn tới là thua ngay.'},
  {key:'goals',    msg:'◎ Màn này chỉ cần dọn các ô có vòng vàng, không cần sạch bàn.'}
];

/**
 * Mốc giới thiệu TỰ TÌM theo bảng màn, không ghi số cứng.
 * Ghi số cứng thì mỗi lần thêm/bớt màn là các mốc lệch hết mà không ai báo —
 * người chơi gặp đá ở màn 31 mà lời giải thích nhảy ra ở màn 25.
 */
const introAt = {};
INTRO.forEach(t=>{
  const has = t.key === 'stoneHp2'
    ? (cfg => cfg.stones > 0 && cfg.stoneHp >= 2)
    : (cfg => cfg[t.key] > 0);
  const i = LEVELS.findIndex(has);
  if (i >= 0) introAt[i] = (introAt[i] || []).concat(t);
});
const introShown = {};

function startLevel(idx){
  G.idx = idx;
  G.level = buildLevel(LEVELS[idx]);
  resetLevel();
  show('scGame');

  (introAt[idx] || []).forEach((t, k)=>{
    if (introShown[t.key]) return;
    introShown[t.key] = true;
    setTimeout(()=> toast(t.msg), 420 + k*2600);
  });
}

function resetLevel(){
  const L = G.level, cfg = L.cfg;
  cancelDiagnose();
  G.moves = 0; G.score = 0;
  G.undosLeft = L.undos;
  G.shufflesLeft = L.shuffles; G.shuffleImpossible = false;
  G.history = [];
  G.selection = []; G.selColor = -1;
  G.busy = false; G.dragging = false;
  G.combo = 0;

  if (L.endless){
    // bàn đầy ngay từ đầu; refillEndless lo luôn việc bảo đảm có nước đi
    G.stacks = [];
    for (let x=0;x<L.geo.cols;x++) G.stacks.push([]);
    G.board = new Array(L.geo.cols*L.geo.rows).fill(EMPTY);
    G.mark  = new Array(L.geo.cols*L.geo.rows).fill(null);
    refillEndless([]);
  } else if (L.gravity){
    // chồng slot đầy đủ (kể cả hàng chờ), từ đáy lên.
    // Dấu đi THEO Ô chứ không theo vị trí: ô rơi xuống thì ngòi nổ và vòng
    // đích phải rơi cùng, nếu gắn theo ô lưới thì chúng đứng yên tại chỗ.
    G.stacks = L.columns.map((col,x)=> col.map((c,k)=> ({
      c, k, m: L.markCols[x][k] ? Object.assign({}, L.markCols[x][k]) : null
    })));
    G.board = new Array(L.geo.cols*L.geo.rows).fill(EMPTY);
    G.mark  = new Array(L.geo.cols*L.geo.rows).fill(null);
    syncBoard();
  } else {
    G.stacks = null;
    G.board = L.template.slice();
    G.mark  = L.marks.map(m => m ? Object.assign({}, m) : null);
  }
  G.goalsLeft = L.goalMode ? goalsOnBoard() : 0;

  $('gName').textContent = L.endless ? '∞ Vô tận' : ((G.idx+1) + '. ' + cfg.name);
  $('gSub').textContent  = L.endless
    ? ('kỷ lục ' + save.endlessBest() + ' · ô rớt xuống mãi')
    : L.goalMode
    ? (L.goalTotal + ' ô đích · ' + L.totalCells + ' ô' + (L.gravity ? ' · gravity' : ''))
    : L.gravity
      ? (L.totalCells + ' ô · ' + L.visibleCells + ' ô hiện · gravity')
      : (L.totalCells + ' ô · ' + cfg.colors + ' màu · bàn tĩnh');
  $('vPar').textContent = L.endless ? (endlessColors(0) + ' màu') : ('tối ưu ' + L.par + ' lượt');
  $('vScore').textContent = '0';

  buildBoardDom();
  layout();
  renderBoard();
  updateHud();
  hideOverlay();
}

function buildBoardDom(){
  const {cols, rows, active} = G.level.geo;
  const box = $('board');
  box.style.setProperty('--cols', cols);
  box.style.setProperty('--rows', rows);
  box.innerHTML = '';
  G.cellEls = new Array(cols*rows).fill(null);

  for (let i=0;i<cols*rows;i++){
    const d = document.createElement('div');
    d.className = 'cell' + (active[i] ? '' : ' wall');
    d.dataset.i = i;
    if (active[i]){
      const b = document.createElement('div');
      b.className = 'bub';
      b.innerHTML = '<span class="gl"></span><span class="fz" hidden></span>';
      d.appendChild(b);
    }
    box.appendChild(d);
    G.cellEls[i] = d;
  }
  $('line').setAttribute('viewBox', '0 0 ' + cols + ' ' + rows);
}

/** Ô vuông, bàn co theo không gian còn lại. */
function layout(){
  if (!G.level) return;
  const {cols, rows} = G.level.geo;
  const wrap = document.querySelector('.board-wrap');
  const cs = Math.max(24, Math.min((wrap.clientWidth - 2)/cols, (wrap.clientHeight - 2)/rows, 62));
  G.cs = cs;
  const box = $('boardBox');
  box.style.width  = (cs*cols) + 'px';
  box.style.height = (cs*rows) + 'px';
  updatePreview();
}

/** (gravity) dựng lại lưới đang thấy từ các chồng slot. */
function syncBoard(){
  const {cols, rows} = G.level.geo;
  G.board.fill(EMPTY);
  G.mark.fill(null);
  for (let x=0;x<cols;x++){
    const st = G.stacks[x], n = Math.min(st.length, rows);
    for (let idx=0; idx<n; idx++){
      const at = (rows-1-idx)*cols + x;
      G.board[at] = st[idx].c;
      G.mark[at]  = st[idx].m;
    }
  }
}

function renderBoard(){
  for (let i=0;i<G.board.length;i++){
    const el = G.cellEls[i], v = G.board[i];
    if (!el || v === WALL) continue;
    el.classList.toggle('empty', !isAlive(v));
    el.classList.remove('pop', 'crack');
    if (!isAlive(v)){ el.classList.remove('goal'); continue; }

    const m = markAt(i);
    const b = el.firstChild;
    b.classList.toggle('wild',  !!m && m.k === K_WILD);
    b.classList.toggle('stone', isStone(v));
    b.classList.toggle('hp2',   isStone(v) && m && m.hp >= 2);
    el.classList.toggle('goal', !!m && m.goal);

    if (isStone(v)){
      b.style.removeProperty('--c');
      b.firstChild.textContent = m && m.hp >= 2 ? '' : '';
    } else {
      b.style.setProperty('--c', HEX[v]);
      // ô đa sắc không mang ký hiệu màu nào cả — nó không thuộc màu nào
      b.firstChild.textContent = (m && m.k === K_WILD) ? '✦' : GLYPHS[v];
    }

    // ngòi nổ: badge đếm ngược, đỏ khi còn <= 2 lượt
    const fz = b.children[1];
    if (m && m.k === K_BOMB){
      fz.hidden = false;
      fz.textContent = m.fz - G.moves;
      fz.classList.toggle('warn', m.fz - G.moves <= 2);
    } else {
      fz.hidden = true;
    }
  }
}

function drawLine(){
  const {cols} = G.level.geo;
  const pts = G.selection.map(i=>{
    const x = i % cols, y = (i - x) / cols;
    return (x + .5) + ',' + (y + .5);
  }).join(' ');
  for (const id of ['poly','glow']){
    const p = $(id);
    p.setAttribute('points', G.selection.length ? pts : '');
    p.setAttribute('stroke', G.selection.length ? selHex() : 'none');
    p.setAttribute('stroke-width', id === 'glow' ? '0.42' : '0.17');
  }
  updatePreview();
}

/** Chip xem trước điểm, bám đầu chuỗi (kiểu ScorePreview của source). */
function updatePreview(){
  const p = $('prev'), n = G.selection.length;
  if (n < 2){ p.classList.remove('on'); return; }
  const {cols} = G.level.geo, head = G.selection[n-1];
  const x = head % cols, y = (head - x) / cols;
  p.style.left = ((x + .5) * G.cs) + 'px';
  p.style.top  = ((y + .5) * G.cs) + 'px';
  p.innerHTML = n + ' ô <b>+' + chainScore(n) + '</b>';
  p.classList.add('on');
}

function updateHud(){
  const L = G.level, left = L.maxMoves - G.moves;

  if (L.endless){
    // Vô tận không có lượt để đếm ngược, nên ô đó chuyển thành số nước ĐÃ đi.
    $('kMoves').textContent = 'Nước đã đi';
    $('vMoves').textContent = G.moves;
    $('vMax').textContent = '';
    $('stMoves').classList.remove('warn');
    $('kLeft').textContent = 'Combo';
    $('vLeft').textContent = G.combo > 0 ? ('x' + endlessMult().toFixed(2).replace(/0$/,'')) : '—';
    $('vStars').style.display = 'none';
    $('vPar').textContent = endlessColors(G.score) + ' màu · kỷ lục ' + save.endlessBest();
    $('vQueue').innerHTML = '';
    $('cUndo').textContent = 0;
    $('gUndo').disabled = true;
    $('cShuf').textContent = G.shufflesLeft;
    $('gShuf').disabled = G.shufflesLeft <= 0;
    return;
  }
  $('kMoves').textContent = 'Lượt còn';
  $('vStars').style.display = '';
  $('vMoves').textContent = left;
  $('vMax').textContent = '/' + L.maxMoves;
  // Màn mục tiêu đếm ô ĐÍCH chứ không đếm ô còn lại — người chơi cần biết
  // mình còn cách thắng bao xa, mà ở đây phần bàn thừa không liên quan.
  $('vLeft').textContent = L.goalMode ? G.goalsLeft : totalLeft();
  $('kLeft').textContent = L.goalMode ? 'Ô đích còn' : 'Ô còn lại';
  $('stMoves').classList.toggle('warn', left <= 2);

  const s = $('vStars').children;
  s[0].classList.toggle('on', G.moves <= L.par);
  s[1].classList.toggle('on', G.moves <= L.star2);
  s[2].classList.toggle('on', G.moves <= L.maxMoves);

  const q = queueLeft();
  $('vQueue').innerHTML = L.gravity ? ('▼ hàng chờ <b>' + q + '</b>') : '';

  $('cUndo').textContent = G.undosLeft;
  $('gUndo').disabled = G.history.length === 0 || G.undosLeft <= 0;
  $('cShuf').textContent = G.shufflesLeft;
  $('gShuf').disabled = G.shufflesLeft <= 0 || G.shuffleImpossible ||
                        totalLeft() < 2 || G.moves >= L.maxMoves;
}

/* ==================================================================
   8. NHẬP LIỆU — kéo chuỗi (chung chuột & cảm ứng)
   ------------------------------------------------------------------
   Cùng luật với source: cùng màu, kề 8 hướng, dài >= 2, lùi về ô kế
   cuối thì bỏ chọn ô cuối.
   ================================================================== */
function cellFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el) return -1;
  const c = el.closest ? el.closest('.cell') : null;
  if (!c || c.classList.contains('wall')) return -1;
  return +c.dataset.i;
}

/** Hệ số nhân điểm hiện tại của chế độ vô tận. */
const endlessMult = () => 1 + Math.min(G.combo, ENDLESS.comboCap) * .25;

/** Chuỗi đang chọn có bao nhiêu ô đa sắc. Luật: tối đa 1. */
const wildsInSelection = () => G.selection.reduce((a,i)=> a + (isWild(i) ? 1 : 0), 0);

function tryAdd(i){
  if (i < 0) return;
  if (isStone(G.board[i])) return;           // đá không nối được, chỉ vỡ do va
  if (!isColor(G.board[i])) return;

  if (!G.selection.length){
    // Bắt đầu bằng ô đa sắc thì màu chuỗi CHƯA quyết định: ô có màu đầu
    // tiên ghép vào sẽ quyết. Nếu lấy luôn màu ẩn dưới ô đa sắc thì người
    // chơi bị khoá vào một màu mà họ không hề nhìn thấy.
    G.selColor = isWild(i) ? -1 : G.board[i];
    pushSel(i);
    return;
  }

  const pos = G.selection.indexOf(i);
  if (pos >= 0){
    if (G.selection.length >= 2 && pos === G.selection.length - 2){
      popSel();
      // lùi khỏi ô có màu duy nhất thì màu chuỗi mở lại
      if (G.selection.every(isWild)) G.selColor = -1;
    }
    return;
  }

  if (isWild(i)){
    if (wildsInSelection() >= 1) return;      // một chuỗi chỉ được một ô đa sắc
  } else if (!matches(i, G.selColor)) return;

  if (!G.level.geo.neighbors[G.selection[G.selection.length-1]].includes(i)) return;
  if (!isWild(i) && G.selColor < 0) G.selColor = G.board[i];
  pushSel(i);
}

/** Màu để vẽ hiệu ứng; chuỗi chưa quyết định màu thì dùng trắng. */
const selHex = () => G.selColor >= 0 ? HEX[G.selColor] : '#ffffff';

function pushSel(i){
  G.selection.push(i);
  G.cellEls[i].classList.add('sel');
  fxRing(G.cellEls[i].getBoundingClientRect(), selHex());
  Sfx.select(G.selection.length);
  buzz(8);
  drawLine();
}
function popSel(){
  const i = G.selection.pop();
  G.cellEls[i].classList.remove('sel');
  drawLine();
}
function clearSelection(){
  G.selection.forEach(i => G.cellEls[i].classList.remove('sel'));
  G.selection = [];
  drawLine();
}

/**
 * Ảnh chụp trạng thái để hoàn tác.
 * Phải lưu cả lời giải: xáo lại thay paths/solution, nên nếu hoàn tác về
 * bàn cũ mà giữ lời giải mới thì nút gợi ý sẽ chỉ vào các ô sai màu.
 */
function snapshot(){
  // Dấu phải chép SÂU: máu đá và số ngòi bị sửa tại chỗ, chép nông thì
  // hoàn tác xong đá vẫn giữ máu đã mất.
  const copyMark = m => m ? Object.assign({}, m) : null;
  return {
    board: G.board.slice(),
    mark: G.mark ? G.mark.map(copyMark) : null,
    stacks: G.stacks ? G.stacks.map(s => s.map(c => ({c:c.c, k:c.k, m:copyMark(c.m)}))) : null,
    paths: G.level.paths, solution: G.level.solution,
    moves: G.moves, score: G.score, goalsLeft: G.goalsLeft
  };
}

/**
 * Đá kề chuỗi vừa ăn mất 1 máu. MỖI NƯỚC TỐI ĐA 1, dù chuỗi có kề nó bằng
 * mấy ô — đây chính là điều kiện mà lúc sinh màn đã bảo đảm được ("mỗi hòn
 * kề ít nhất `hp` đường phân biệt"), đổi luật ở đây là mất bảo đảm đó.
 */
function damageStones(clearedIdx){
  const nb = G.level.geo.neighbors, hit = new Set();
  clearedIdx.forEach(i => nb[i].forEach(j => { if (isStone(G.board[j])) hit.add(j); }));

  let broken = 0;
  hit.forEach(j=>{
    const m = G.mark[j];
    if (!m) return;
    m.hp--;
    const el = G.cellEls[j];
    if (m.hp > 0){
      if (el){ el.classList.remove('crack'); void el.offsetWidth; el.classList.add('crack'); }
    } else {
      G.board[j] = EMPTY;
      G.mark[j] = null;
      broken++;
      if (el) fxBurst(el.getBoundingClientRect(), '#8b93ad', 8);
    }
  });
  if (hit.size) Sfx.bad();
  return broken;
}

function commit(){
  const sel = G.selection.slice();
  if (sel.length < 2){ if (sel.length) Sfx.bad(); clearSelection(); return; }

  const L = G.level, n = sel.length;
  let gained = chainScore(n);

  // Vô tận: chuỗi dài liên tiếp nhân điểm. Đây là thứ duy nhất biến "ăn cho
  // hết" thành "ăn cho khéo" khi đã bỏ hết giới hạn lượt.
  if (L.endless){
    if (n >= ENDLESS.comboMin) G.combo++; else G.combo = 0;
    gained = Math.round(gained * endlessMult());
  }

  G.history.push(snapshot());
  G.busy = true;
  G.shuffleImpossible = false;      // bàn đã đổi, đánh giá lại từ đầu

  /* ----- hiệu ứng phá ô ----- */
  let sx = 0, sy = 0;
  sel.forEach((i,k)=>{
    const el = G.cellEls[i], r = el.getBoundingClientRect();
    sx += r.left + r.width/2; sy += r.top + r.height/2;
    el.classList.remove('sel');
    el.style.setProperty('--d', (k*26) + 'ms');
    el.classList.add('pop');
    setTimeout(()=> fxBurst(r, selHex(), n >= 6 ? 9 : 6), k*26 + 90);
  });
  sx /= n; sy /= n;

  /* ----- hiệu ứng ăn điểm ----- */
  fxText(sx, sy, '+' + gained, '#fff', n >= 8 ? 34 : (n >= 5 ? 28 : 23), 54, 60);
  const pr = L.endless && G.combo > 1 ? ('COMBO x' + endlessMult().toFixed(2).replace(/0$/,'')) : praise(n);
  if (pr) fxText(sx, sy - 26, pr, L.endless && G.combo > 1 ? '#fbbf24' : selHex(),
                 n >= 10 ? 22 : 18, 44, 220);
  fxFlash(n >= 8 ? .3 : (n >= 5 ? .18 : .09));
  if (n >= 6) fxShake();
  Sfx.clear(n);
  buzz(n >= 6 ? [18,40,26] : 26);

  /* ----- cập nhật logic ngay, animation chạy sau ----- */
  const oldScore = G.score;
  G.score += gained;
  G.moves++;
  animateScore(oldScore, G.score);
  bump('stLeft');

  const clearedIdx = sel.slice();
  G.selection = []; G.selColor = -1; drawLine();

  /* ----- ô đích vừa dọn được ----- */
  if (L.goalMode){
    let got = 0;
    clearedIdx.forEach(i => { const m = markAt(i); if (m && m.goal) got++; });
    if (got){
      G.goalsLeft -= got;
      fxText(sx, sy - 52, got > 1 ? got + ' đích!' : 'đích!', '#fbbf24', 22, 46, 140);
    }
  }

  if (!L.gravity){
    clearedIdx.forEach(i => { G.board[i] = EMPTY; G.mark[i] = null; });
    // va đá sau khi chuỗi đã biến mất, đúng thứ tự mà validateLevel kiểm
    damageStones(clearedIdx);
  }
  updateHud();

  const popDur = 300 + n*26;
  setTimeout(()=>{
    if (L.gravity) applyGravity(clearedIdx);
    else { renderBoard(); G.busy = false; evaluate(); }
  }, popDur);
}

/* ==================================================================
   9. GRAVITY — rơi xuống + hàng chờ tụt vào
   ================================================================== */
function applyGravity(clearedIdx){
  const {cols, rows} = G.level.geo;

  // grid index -> (cột, chỉ số trong chồng tính từ đáy)
  const byCol = {};
  clearedIdx.forEach(i=>{
    const x = i % cols, y = (i - x) / cols, idx = rows - 1 - y;
    (byCol[x] = byCol[x] || []).push(idx);
  });

  // xoá + ghi lại ô nào tụt xuống bao nhiêu
  const falls = [];                                  // {x, fromIdx, toIdx}
  for (const xs in byCol){
    const x = +xs, gone = new Set(byCol[xs]);
    const kept = []; let shift = 0;
    G.stacks[x].forEach((cell, idx)=>{
      if (gone.has(idx)){ shift++; return; }
      if (shift > 0) falls.push({x, from:idx, to:idx - shift});
      kept.push(cell);
    });
    G.stacks[x] = kept;
  }

  // Vô tận: đổ đầy lại NGAY, trước khi vẽ, để ô mới dùng chung một lượt
  // hoạt ảnh rơi với ô cũ — nhìn thành một dòng chảy liên tục chứ không
  // phải "rơi xong rồi mới thấy ô mới hiện ra".
  if (G.level.endless) refillEndless(falls);

  syncBoard();
  renderBoard();

  // hoạt ảnh rơi: dịch từ vị trí cũ về 0
  const cs = G.cs;
  let maxDelay = 0, moved = 0;
  falls.forEach(f=>{
    const yTo = rows - 1 - f.to;
    if (yTo < 0 || yTo >= rows) return;
    const yFrom = rows - 1 - f.from;                 // < 0 nếu tụt từ hàng chờ
    const dy = (yFrom - yTo) * cs;
    if (!dy) return;
    const el = G.cellEls[yTo*cols + f.x];
    if (!el || !el.firstChild) return;
    const delay = f.to * 12;
    maxDelay = Math.max(maxDelay, delay);
    moved++;
    el.firstChild.animate(
      [{transform:'translateY(' + dy + 'px)'}, {transform:'translateY(0)'}],
      {duration:260 + Math.min(260, Math.abs(dy)*.9), delay, easing:'cubic-bezier(.3,1.25,.5,1)'}
    );
  });

  if (moved){
    $('board').classList.add('clip');
    Sfx.fall();
  }
  setTimeout(()=>{
    $('board').classList.remove('clip');
    G.busy = false;
    updateHud();
    evaluate();
  }, moved ? 420 + maxDelay : 0);
}

/* ==================================================================
   10. THẮNG / THUA
   ================================================================== */
/** Các ô mang ngòi nổ đã cháy hết (đếm ngược về 0 mà chưa được ăn). */
function blownBombs(){
  const out = [];
  for (let i=0;i<G.board.length;i++){
    const m = markAt(i);
    if (isAlive(G.board[i]) && m && m.k === K_BOMB && m.fz - G.moves <= 0) out.push(i);
  }
  return out;
}

function evaluate(){
  const L = G.level, left = totalLeft();

  /* Vô tận không có "thắng". Ván chỉ dừng khi bàn hết nước đi thật sự —
     mà bàn luôn đầy, nên chuyện đó chỉ xảy ra khi số màu đã lên cao. */
  if (L.endless){
    if (hasMove()) return;
    const record = G.score > save.endlessBest();
    save.recordEndless(G.score);
    Sfx.lose();
    G.busy = true;
    diagnose({t:'Hết nước đi', s:'', hint:'Không ô nào còn ô ghép được bên cạnh',
              groups:[aliveVisible()]}, ()=>{
      G.busy = false;
      endlessCard(record);
    });
    return;
  }

  const won = L.goalMode ? G.goalsLeft <= 0 : left === 0;

  if (won){
    const stars = G.moves <= L.par ? 3 : (G.moves <= L.star2 ? 2 : 1);
    const prevBest = save.best(G.idx);
    save.record(G.idx, stars, G.score);
    Sfx.win(); fxConfetti(); buzz([30,60,30,60,80]);
    winCard(stars, prevBest);
    return;
  }

  // Ngòi nổ được xét TRƯỚC hết lượt: nó là lý do cụ thể hơn, và người chơi
  // nhìn thấy con số đếm ngược nên đây là cái họ đang theo dõi.
  const blown = blownBombs();
  const remain = L.goalMode ? G.goalsLeft + ' ô đích' : left + ' ô';
  const reason = blown.length
    ? {t:'Ngòi nổ cháy hết',
       s:'<b>' + blown.length + '</b> ô mang ngòi hết giờ trước khi bạn dọn tới.',
       hint:'Ngòi nổ hết giờ', groups:[blown]}
    : G.moves >= L.maxMoves
      ? {t:'Hết lượt', s:'Còn <b>' + remain + '</b> chưa dọn.',
         hint:'Còn ' + remain + ' chưa dọn', groups:[goalOrAlive()]}
      : deadReason();
  if (!reason) return;

  Sfx.lose();
  G.busy = true;                                   // chặn input trong lúc xem bàn
  diagnose(reason, ()=>{
    G.busy = false;
    loseCard(reason.t, reason.s);
  });
}

/**
 * Chỉ cho người chơi thấy SAI Ở ĐÂU trước khi bật panel thua.
 * Làm mờ cả bàn, rồi lần lượt thắp sáng từng nhóm ô là bằng chứng, có đánh số
 * khi có nhiều nhóm ("4 nhóm rời nhau" thì đếm 1-2-3-4 ngay trên bàn).
 * Chạm màn hình để bỏ qua, không bắt ai phải ngồi chờ.
 */
let diagAbort = null;

/** Huỷ chẩn đoán đang chạy mà KHÔNG bật panel — dùng khi chơi lại / về menu. */
function cancelDiagnose(){
  if (diagAbort){ const f = diagAbort; diagAbort = null; f(); }
}

function diagnose(reason, onDone){
  cancelDiagnose();
  const board = $('board'), bn = $('diag');
  const groups = (reason.groups || []).filter(g => g && g.length);

  board.classList.add('diag');
  bn.innerHTML = '<b>' + reason.t + '</b><i>' + (reason.hint || '') + '</i>' +
                 '<em>chạm để tiếp tục</em>';
  bn.classList.add('on');
  fxShake();

  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  // nhịp: nhiều nhóm thì thắp nhanh hơn, tổng thời gian vẫn nằm trong tầm chú ý
  const step = groups.length > 1 ? clamp(1500/groups.length, 170, 420) : 0;
  let t = 420;
  groups.forEach((g, gi)=>{
    at(t, ()=>{
      g.forEach(i => { const el = G.cellEls[i]; if (el) el.classList.add('cul'); });
      if (groups.length > 1){
        const el = G.cellEls[g[0]];
        if (el){
          const r = el.getBoundingClientRect();
          fxText(r.left + r.width/2, r.top + r.height/2, String(gi+1), '#fff', 21, 24, 0);
        }
      }
      Sfx.tone(280 + gi*55, .09, 'square', .06);
    });
    t += step;
  });

  let done = false;
  const teardown = ()=>{
    done = true;
    timers.forEach(clearTimeout);
    document.removeEventListener('pointerdown', finish, true);
    board.classList.remove('diag');
    bn.classList.remove('on');
    Array.prototype.forEach.call(document.querySelectorAll('.cell.cul'),
      el => el.classList.remove('cul'));
  };
  function finish(){
    if (done) return;
    teardown();
    diagAbort = null;
    onDone();
  }

  diagAbort = ()=>{ if (!done) teardown(); };
  at(Math.max(1900, t + 900), finish);
  at(400, ()=> document.addEventListener('pointerdown', finish, true));
}

function hideOverlay(){ $('ov').classList.remove('on'); }

function winCard(stars, prevBest){
  const last = G.idx >= LEVELS.length - 1;
  const isRecord = G.score > prevBest;
  $('ovCard').innerHTML =
    '<h2>Qua màn!</h2>' +
    '<div class="bigstars">' +
      [0,1,2].map(k=> '<i class="' + (k<stars?'on':'') + '" style="--d:' + (k*.12+.1) + 's">★</i>').join('') +
    '</div>' +
    '<div class="sub">Dùng <b>' + G.moves + '</b>/' + G.level.maxMoves + ' lượt · tối ưu ' + G.level.par + '<br>' +
      'Điểm <b>' + G.score + '</b>' + (isRecord ? ' 🎉 kỷ lục mới' : (prevBest ? ' (tốt nhất ' + prevBest + ')' : '')) + '</div>' +
    '<div class="acts">' +
      (last ? '' : '<button class="btn primary" id="oNext">Màn tiếp theo →</button>') +
      (stars < 3 ? '<button class="btn" id="oRetry">Thử lại để lấy 3★</button>' : '') +
      '<button class="btn ghost" id="oMenu">Danh sách màn</button>' +
    '</div>';
  $('ov').classList.add('on');
  if (!last) $('oNext').onclick = ()=> startLevel(G.idx + 1);
  if (stars < 3) $('oRetry').onclick = resetLevel;
  $('oMenu').onclick = toMenu;
}

function loseCard(title, sub){
  const canUndo = G.history.length > 0 && G.undosLeft > 0;
  // Xáo lại chỉ có nghĩa khi còn lượt đi — hết lượt thì xáo cũng không cứu được.
  const canShuffle = G.shufflesLeft > 0 && G.moves < G.level.maxMoves &&
                     totalLeft() >= 2 && !G.shuffleImpossible;
  let first = true;
  const mark = ()=> first ? (first = false, ' primary') : '';
  $('ovCard').innerHTML =
    '<h2>' + title + '</h2><div class="sub">' + sub + '</div>' +
    '<div class="acts">' +
      (canShuffle ? '<button class="btn' + mark() + '" id="oShuf">🔀 Xáo lại màn (còn ' + G.shufflesLeft + ')</button>' : '') +
      (canUndo    ? '<button class="btn' + mark() + '" id="oUndo">↶ Hoàn tác (còn ' + G.undosLeft + ')</button>' : '') +
      '<button class="btn' + mark() + '" id="oRetry">↻ Chơi lại màn</button>' +
      '<button class="btn ghost" id="oMenu">Danh sách màn</button>' +
    '</div>';
  $('ov').classList.add('on');
  if (canShuffle) $('oShuf').onclick = ()=>{ hideOverlay(); shuffleBoard(); };
  if (canUndo)    $('oUndo').onclick = ()=>{ hideOverlay(); undo(); };
  $('oRetry').onclick = resetLevel;
  $('oMenu').onclick = toMenu;
}

/** Thẻ kết ván vô tận: chỉ có điểm, kỷ lục và chơi lại. */
function endlessCard(record){
  const best = save.endlessBest();
  $('ovCard').innerHTML =
    '<h2>Hết nước đi</h2>' +
    '<div class="sub">Không còn hai ô nào ghép được với nhau.</div>' +
    '<div class="bigstars" style="font-size:34px;font-weight:900;color:#fff">' + G.score + '</div>' +
    '<div class="sub">' + G.moves + ' nước · ' +
      (record ? '<b style="color:#fbbf24">★ kỷ lục mới</b>' : ('kỷ lục ' + best)) + '</div>' +
    '<div class="acts">' +
      '<button class="btn primary" id="oRetry">↻ Chơi ván mới</button>' +
      '<button class="btn ghost" id="oMenu">Danh sách màn</button>' +
    '</div>';
  $('ov').classList.add('on');
  $('oRetry').onclick = resetLevel;
  $('oMenu').onclick = toMenu;

/* ==================================================================
   11. HOÀN TÁC (giới hạn theo màn) / GỢI Ý
   ================================================================== */
function undo(){
  if (G.busy) return;
  if (!G.history.length){ toast('Chưa có nước nào để hoàn tác.'); return; }
  if (G.undosLeft <= 0){ toast('Hết lượt hoàn tác của màn này — hãy chơi lại.'); Sfx.bad(); return; }

  const h = G.history.pop();
  G.board = h.board; G.moves = h.moves; G.score = h.score;
  if (h.mark) G.mark = h.mark;
  if (h.stacks) G.stacks = h.stacks;
  G.goalsLeft = h.goalsLeft;
  G.level.paths = h.paths; G.level.solution = h.solution;
  G.undosLeft--;
  G.shuffleImpossible = false;      // bàn đã đổi, đánh giá lại từ đầu

  clearSelection(); renderBoard();
  $('vScore').textContent = G.score;
  updateHud();
  Sfx.undo();
}

/* ==================================================================
   11B. XÁO LẠI MÀN
   ------------------------------------------------------------------
   Giữ nguyên VỊ TRÍ và SỐ LƯỢNG ô còn lại, chỉ tô lại màu sao cho tồn
   tại một lời giải mới — dùng đúng hai bộ sinh của mục 2, chỉ khác là
   chạy trên phần bàn còn lại thay vì bàn đầy.

   Lời giải mới phải lọt vào số lượt CÒN LẠI, nên độ dài nhóm được đẩy
   lên theo tỉ lệ ô/lượt. Nếu chật quá thì không xáo và nói thẳng, chứ
   không xáo ra một bàn vẫn không thắng được.
   ================================================================== */
function shuffleTargetLen(cellsLeft, movesLeft){
  const need = Math.max(3, Math.ceil(cellsLeft / Math.max(1, movesLeft)));
  const lo = Math.min(need, 8);
  return [lo, Math.min(lo + 2, 12)];
}

/**
 * Số nước mà một bộ đường mới thật sự đòi hỏi. Ở màn mục tiêu chỉ cần ăn
 * những đường CÓ CHỨA ô đích, phần còn lại không phải đi.
 */
function movesNeededFor(paths){
  if (!G.level.goalMode) return paths.length;
  return paths.filter(p => p.some(i => { const m = markAt(i); return m && m.goal; })).length;
}

/** Thử xáo bàn tĩnh. Trả {apply, moves} hoặc null. */
function planShuffleStatic(movesLeft){
  const {cols, rows} = G.level.geo;
  const alive = new Array(cols*rows).fill(false);
  let R = 0;
  // Đá không tô lại được nên không vào bộ đường; chúng đứng nguyên chỗ cũ.
  for (let i=0;i<G.board.length;i++) if (isColor(G.board[i])){ alive[i] = true; R++; }
  if (R < 2) return null;

  const geo2 = geometryFromMask(cols, rows, alive);
  const pathLen = shuffleTargetLen(R, movesLeft);
  let best = null, bestRand = null, bestMoves = Infinity;

  for (let a=0;a<300;a++){
    const seed = (G.level.cfg.seed||1) + 100003*G.shuffleN + a*7919;
    const paths = tryPartition(geo2, {pathLen}, mulberry32(seed));
    if (!paths) continue;
    // Một chuỗi chỉ được chứa 1 ô đa sắc, nên bộ đường nào gom 2 ô đa sắc
    // vào cùng một đường là bộ KHÔNG chơi được — loại thẳng.
    if (paths.some(p => p.filter(isWild).length > 1)) continue;

    const need = movesNeededFor(paths);
    if (need < bestMoves){ best = paths; bestRand = seed; bestMoves = need; }
    if (bestMoves <= movesLeft) break;
  }
  if (!best) return null;

  return {
    moves: bestMoves,
    apply(){
      const colorOfPath = assignColors(geo2, best, G.level.cfg, mulberry32(bestRand + 13));
      best.forEach((p,idx)=> p.forEach(i => G.board[i] = colorOfPath[idx]));
      G.level.paths = best;                      // lời giải mới cho nút gợi ý

      // Ngòi nổ phải đặt lại theo THỨ TỰ MỚI: bàn vừa đổi hết màu, con số cũ
      // được tính cho một lời giải không còn tồn tại nên có thể không còn kịp.
      const slack = G.level.cfg.bombSlack == null ? 3 : G.level.cfg.bombSlack;
      best.forEach((p,idx)=> p.forEach(i=>{
        const m = markAt(i);
        if (m && m.k === K_BOMB) m.fz = G.moves + idx + 1 + slack;
      }));
    }
  };
}

/** Thử xáo bàn gravity (xáo cả hàng chờ). Trả {apply, moves} hoặc null. */
function planShuffleGravity(movesLeft){
  const cfg = G.level.cfg;
  const heights = G.stacks.map(s => s.length);
  const R = heights.reduce((a,b)=> a+b, 0);
  if (R < 2) return null;

  const pathLen = shuffleTargetLen(R, movesLeft);
  const old = G.stacks;                       // dấu ô đi theo VỊ TRÍ trong cột
  const markOf = (x,k) => (old[x] && old[x][k]) ? old[x][k].m : null;
  const isWildSlot = s => { const m = markOf(s.x, s.k); return !!m && m.k === K_WILD; };
  const isGoalSlot = s => { const m = markOf(s.x, s.k); return !!m && m.goal; };

  let best = null, bestMoves = Infinity;
  for (let a=0;a<250;a++){
    const rand = mulberry32((cfg.seed||1) + 100003*G.shuffleN + a*7919);
    const r = simulateGravity(Object.assign({}, cfg, {pathLen}), rand, heights);
    if (!r) continue;
    if (r.solution.some(mv => mv.filter(isWildSlot).length > 1)) continue;

    // màn mục tiêu: chỉ cần chạy tới nước cuối cùng còn chạm ô đích
    let need = r.solution.length;
    if (G.level.goalMode){
      let last = -1;
      r.solution.forEach((mv,t)=> { if (mv.some(isGoalSlot)) last = t; });
      if (last < 0) continue;                 // bộ này bỏ sót ô đích => vô dụng
      need = last + 1;
    }
    if (need < bestMoves){ best = r; bestMoves = need; }
    if (bestMoves <= movesLeft) break;
  }
  if (!best) return null;

  return {
    moves: bestMoves,
    apply(){
      // Màu đổi hết nhưng DẤU ở nguyên vị trí: ô đích và ngòi nổ phải nằm y
      // chỗ cũ, nếu không người chơi đang nhắm một ô thì nó biến đi đâu mất.
      // k đánh lại từ 0 để khớp solution mới; dấu giữ theo vị trí cũ
      G.stacks = best.columns.map((col,x)=> col.map((c,k)=> ({c, k, m: markOf(x,k)})));
      G.level.solution = best.solution;

      const slack = cfg.bombSlack == null ? 3 : cfg.bombSlack;
      best.solution.forEach((mv,t)=> mv.forEach(s=>{
        const m = markOf(s.x, s.k);
        if (m && m.k === K_BOMB) m.fz = G.moves + t + 1 + slack;
      }));
      syncBoard();
    }
  };
}

function shuffleBoard(){
  if (G.busy) return;
  const L = G.level, movesLeft = L.maxMoves - G.moves;
  if (G.shufflesLeft <= 0){ toast('Hết lượt xáo của màn này.'); Sfx.bad(); return; }

  // Vô tận không có lời giải để dựng lại — chỉ cần gieo ra một bàn còn đi được.
  if (L.endless){
    G.shufflesLeft--;
    clearSelection();
    reshuffleEndless();
    G.combo = 0;                       // xáo là mất mạch combo, đó là cái giá
    renderBoard(); updateHud(); hideOverlay();
    Sfx.shuffle(); buzz(24);
    toast('Đã xáo lại bàn — mạch combo về 0.');
    return;
  }
  if (totalLeft() < 2){ toast('Không còn gì để xáo.'); return; }

  G.shuffleN++;
  const plan = L.gravity ? planShuffleGravity(movesLeft) : planShuffleStatic(movesLeft);

  // Không xáo ra một bàn vẫn thua — nói thẳng, giữ lại lượt xáo, và nhớ là
  // trạng thái này vô vọng để thẻ thua không mời xáo lần nữa.
  if (!plan || plan.moves > movesLeft){
    G.shuffleImpossible = true;
    updateHud();                      // vô hiệu hoá luôn nút Xáo trên bàn
    Sfx.bad();
    const what = L.goalMode ? G.goalsLeft + '</b> ô đích' : totalLeft() + '</b> ô';
    const msg = 'Còn <b>' + what + ' mà chỉ còn <b>' + movesLeft + '</b> lượt — ' +
                'không có cách xáo nào đủ để ' + (L.goalMode ? 'chạm hết đích.' : 'dọn sạch.');
    if (deadReason() || G.moves >= L.maxMoves) loseCard('Xáo cũng không cứu được', msg);
    else toast('Xáo không đủ: còn ' + totalLeft() + ' ô mà chỉ còn ' + movesLeft + ' lượt.');
    return;
  }

  G.history.push(snapshot());
  G.shufflesLeft--;
  clearSelection();
  plan.apply();
  renderBoard();
  updateHud();
  hideOverlay();

  // hiệu ứng: mọi ô nảy lên so le
  const {cols} = L.geo;
  for (let i=0;i<G.board.length;i++){
    if (G.board[i] < 0) continue;
    const el = G.cellEls[i], x = i % cols, y = (i - x) / cols;
    el.firstChild.animate(
      [{transform:'scale(.25) rotate(-90deg)', opacity:.2}, {transform:'none', opacity:1}],
      {duration:340, delay:(x + y)*22, easing:'cubic-bezier(.3,1.4,.5,1)'}
    );
  }
  Sfx.shuffle();
  buzz(24);
  toast('Đã xáo lại — lời giải mới cần ' + plan.moves + ' lượt, bạn còn ' + movesLeft + '.');
}

/** Gợi ý: nháy một nhóm trong lời giải gốc còn nguyên vẹn và đang thấy. */
function hint(){
  if (G.busy) return;
  const L = G.level;
  let cells = null;

  if (L.endless){
    // Không có lời giải ghi sẵn: tìm sống một cặp ghép được, ưu tiên cặp nào
    // kéo dài ra được nhiều ô nhất để gợi ý cũng là gợi ý ĂN NGON.
    const nb = L.geo.neighbors;
    let best = null;
    for (let i=0;i<G.board.length;i++){
      if (!isColor(G.board[i])) continue;
      for (const j of nb[i]){
        if (!(G.board[j] === G.board[i] || isWild(j) || isWild(i))) continue;
        // đo nhanh cụm cùng màu quanh i
        const c = G.board[i], seen = new Set([i]), stack = [i];
        while (stack.length){
          const k = stack.pop();
          for (const m of nb[k])
            if (!seen.has(m) && (G.board[m] === c || isWild(m))){ seen.add(m); stack.push(m); }
        }
        if (!best || seen.size > best.size) best = seen;
        break;
      }
    }
    if (best) cells = [...best].slice(0, 8);
  } else if (L.gravity){
    // slot còn lại -> vị trí hiện tại; chỉ gợi ý nhóm còn đủ và đang nhìn thấy
    const {cols, rows} = L.geo;
    const posOf = new Map();
    for (let x=0;x<cols;x++)
      G.stacks[x].forEach((cell, idx)=>{ if (idx < rows) posOf.set(x + ',' + cell.k, (rows-1-idx)*cols + x); });
    for (const mv of L.solution){
      const got = mv.map(s => posOf.get(s.x + ',' + s.k));
      if (got.every(v => v !== undefined)){ cells = got; break; }
    }
  } else {
    // Màn mục tiêu: ưu tiên chỉ đường nào CÓ ô đích — gợi ý một đường không
    // dính đích thì đúng luật nhưng chẳng đưa người chơi tới gần chiến thắng.
    const intact = L.paths.filter(p => p.every(i => isColor(G.board[i])));
    const p = (L.goalMode && intact.find(p => p.some(i => { const m = markAt(i); return m && m.goal; })))
              || intact[0];
    if (p) cells = p;
  }

  if (!cells){ toast('Lời giải gốc đã bị chẻ — thử Hoàn tác hoặc Chơi lại.'); return; }
  cells.forEach(i=>{
    const el = G.cellEls[i];
    el.classList.add('hint');
    setTimeout(()=> el.classList.remove('hint'), 2200);
  });
}

let toastT;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=> t.classList.remove('on'), 2100);
}

/* ==================================================================
   12. ĐIỀU HƯỚNG + MENU
   ================================================================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'scGame') requestAnimationFrame(layout);
}
function toMenu(){ cancelDiagnose(); hideOverlay(); renderMenu(); show('scMenu'); }

function renderMenu(){
  const host = $('worlds');
  host.innerHTML = '';
  let cur = null, grid = null;
  LEVELS.forEach((cfg,i)=>{
    if (cfg.w !== cur){
      cur = cfg.w;
      const h = document.createElement('div');
      h.className = 'world';
      h.textContent = WORLD_NAMES[cur] || ('Thế giới ' + cur);
      host.appendChild(h);
      grid = document.createElement('div');
      grid.className = 'levels';
      host.appendChild(grid);
    }
    const st = save.stars(i), open = save.unlocked(i);
    const b = document.createElement('button');
    b.className = 'lv' + (open ? '' : ' locked') + (st ? ' done' : '');
    b.innerHTML = (cfg.gravity ? '<span class="gv">▼</span>' : '') +
      (open ? (i+1) : '🔒') +
      '<span class="st">' + (open ? [0,1,2].map(k=> k<st?'<b>★</b>':'★').join('') : '') + '</span>';
    // Nút màn chưa mở PHẢI phản hồi. Trước đây nó không được gắn onclick nên
    // bấm vào là im lặng hoàn toàn — không phân biệt được với "game hỏng".
    b.onclick = open
      ? (()=> startLevel(i))
      : (()=>{
          Sfx.bad();
          toast('Màn ' + (i+1) + ' chưa mở. Qua màn trước để mở, hoặc bật 🔓 Chơi tự do ở cuối menu.');
        });
    grid.appendChild(b);
  });
  syncToggles();
}

function syncToggles(){
  document.body.classList.toggle('symbols', !!save.data.symbols);
  const on = save.data.sound;
  $('mSound').textContent = (on ? '🔊' : '🔇') + ' Âm thanh';
  $('gSound').textContent = on ? '🔊' : '🔇';
  $('mSym').textContent = (save.data.symbols ? '◆' : '○') + ' Ký hiệu';
  $('mEndlessBest').textContent = 'kỷ lục ' + save.endlessBest();
  $('mFree').textContent = (save.freePlay() ? '🔓' : '🔒') + ' Chơi tự do';
  $('mFree').classList.toggle('on', save.freePlay());
}

/* ==================================================================
   13. SỰ KIỆN
   ================================================================== */
const bbox = $('boardBox');
bbox.addEventListener('pointerdown', e=>{
  if (G.busy) return;
  const i = cellFromPoint(e.clientX, e.clientY);
  if (i < 0 || G.board[i] < 0) return;
  e.preventDefault();
  try{ bbox.setPointerCapture(e.pointerId); }catch(err){}
  G.dragging = true;
  clearSelection();
  tryAdd(i);
});
bbox.addEventListener('pointermove', e=>{
  if (!G.dragging || G.busy) return;
  e.preventDefault();
  tryAdd(cellFromPoint(e.clientX, e.clientY));
});
function endDrag(e){
  if (!G.dragging) return;
  G.dragging = false;
  try{ bbox.releasePointerCapture(e.pointerId); }catch(err){}
  commit();
}
bbox.addEventListener('pointerup', endDrag);
bbox.addEventListener('pointercancel', endDrag);
bbox.addEventListener('contextmenu', e=> e.preventDefault());

$('gBack').onclick    = toMenu;
$('gUndo').onclick    = undo;
$('gShuf').onclick    = shuffleBoard;
$('gHint').onclick    = hint;
$('gRestart').onclick = resetLevel;
$('gSound').onclick   = ()=>{ save.data.sound = !save.data.sound; save.flush(); syncToggles(); };
$('mSound').onclick   = ()=>{ save.data.sound = !save.data.sound; save.flush(); syncToggles(); };
$('mSym').onclick     = ()=>{ save.data.symbols = !save.data.symbols; save.flush(); syncToggles(); };
$('mEndless').onclick = startEndless;
$('mFree').onclick    = ()=>{
  save.setFreePlay(!save.freePlay());
  syncToggles();
  renderMenu();                       // lưới màn phải vẽ lại: khoá vừa đổi
  toast(save.freePlay()
    ? 'Chơi tự do: vào thẳng màn nào cũng được. Sao và điểm vẫn được ghi.'
    : 'Đã tắt chơi tự do — mở màn theo tiến trình như cũ.');
};
$('mReset').onclick   = ()=>{
  if (confirm('Xoá toàn bộ tiến độ?')){ save.data.stars = {}; save.data.best = {}; save.flush(); renderMenu(); }
};

addEventListener('resize', layout);
addEventListener('keydown', e=>{
  if (!$('scGame').classList.contains('on')) return;
  if (e.key === 'z' || e.key === 'Z') undo();
  if (e.key === 'r' || e.key === 'R') resetLevel();
  if (e.key === 'h' || e.key === 'H') hint();
  if (e.key === 'Escape') toMenu();
});

/* ==================================================================
   14. KHỞI ĐỘNG + tự kiểm tra bảng màn
   ================================================================== */
save.load();
renderMenu();

(function selfTest(){
  const rows = [];
  for (let i=0;i<LEVELS.length;i++){
    try{
      const L = buildLevel(LEVELS[i]);
      rows.push({'#':i+1, 'tên':LEVELS[i].name, 'gravity':!!L.gravity,
                 'tổng ô':L.totalCells, 'ô hiện':L.visibleCells,
                 'par':L.par, '2★':L.star2, 'tối đa':L.maxMoves, 'undo':L.undos});
    }catch(err){
      rows.push({'#':i+1, 'tên':LEVELS[i].name, 'par':'LỖI: ' + err.message});
    }
  }
  console.table(rows);
})();
</script>
